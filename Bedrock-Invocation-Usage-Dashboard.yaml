      DataPrepConfiguration:
        SourceTableMap:
          3908a1f9-85bf-4c60-b078-9ada9d2144fe:
            PhysicalTableId: 3e16549b-84ef-49f9-923f-74eee799fb1b
        TransformStepMap:
          d89d9381-f10c-43c3-a343-d3d0b0d837e8:
