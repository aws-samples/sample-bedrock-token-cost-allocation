dashboards:
  BEDROCK INVOCATION USAGE DASHBOARD:
    dependsOn:
      datasets:
      - bedrock_invocations_view
    name: Bedrock Invocation Usage Dashboard
    dashboardId: bedrock-invocation-usage-dashboard
    category: Custom
    theme: NITRO
    templateId: bedrock-invocation-usage-dashboard
    sourceAccountId: '213485169607'
    region: us-east-1
datasets:
  bedrock_invocations_view:
    data:
      DataSetId: e9fce782-cf0f-469f-b732-a032f2db4159
      Name: bedrock_invocations_view
      PhysicalTableMap:
        3e16549b-84ef-49f9-923f-74eee799fb1b:
          RelationalTable:
            DataSourceArn: ${athena_datasource_arn}
            Catalog: AwsDataCatalog
            Schema: ${athena_database_name}
            Name: bedrock_invocations_view
            InputColumns:
            - Name: account_id
              Type: STRING
            - Name: payer_id
              Type: STRING
            - Name: timestamp
              Type: STRING
            - Name: region
              Type: STRING
            - Name: requestid
              Type: STRING
            - Name: operation
              Type: STRING
            - Name: modelid
              Type: STRING
            - Name: identity_arn
              Type: STRING
            - Name: requestmetadata
              Type: STRING
            - Name: year
              Type: STRING
            - Name: month
              Type: STRING
            - Name: day
              Type: STRING
            - Name: input_token_count
              Type: INTEGER
            - Name: input_content_type
              Type: STRING
            - Name: output_token_count
              Type: INTEGER
            - Name: output_content_type
              Type: STRING
            - Name: usage_input_tokens
              Type: INTEGER
            - Name: usage_output_tokens
              Type: INTEGER
            - Name: usage_total_tokens
              Type: INTEGER
            - Name: usage_cache_read_tokens
              Type: INTEGER
            - Name: usage_cache_write_tokens
              Type: INTEGER
            - Name: stop_reason
              Type: STRING
            - Name: response_preview
              Type: STRING
            - Name: prompt_preview
              Type: STRING
      ImportMode: SPICE
      LogicalTableMap:
        bedrock-invocations-view-logical:
          Alias: bedrock_invocations_view
          Source:
            PhysicalTableId: 3e16549b-84ef-49f9-923f-74eee799fb1b
    dependsOn:
      views:
      - bedrock_invocations_view
    schedules:
    - default
crawlers: {}
views:
  bedrock_invocations_view:
    dependsOn: {}
    data: |-
      CREATE OR REPLACE VIEW "${athena_database_name}".bedrock_invocations_view AS
      SELECT
        account_id
      , payer_id
      , timestamp
      , region
      , requestid
      , operation
      , modelid
      , identity_arn
      , JSON_FORMAT(CAST(requestmetadata AS JSON)) requestmetadata
      , year
      , month
      , day
      , input.inputtokencount input_token_count
      , input.inputcontenttype input_content_type
      , output.outputtokencount output_token_count
      , output.outputcontenttype output_content_type
      , CAST(json_extract_scalar(output.outputbodyjson, '$.usage.inputTokens') AS INTEGER) usage_input_tokens
      , CAST(json_extract_scalar(output.outputbodyjson, '$.usage.outputTokens') AS INTEGER) usage_output_tokens
      , CAST(json_extract_scalar(output.outputbodyjson, '$.usage.totalTokens') AS INTEGER) usage_total_tokens
      , CAST(json_extract_scalar(output.outputbodyjson, '$.usage.cacheReadInputTokenCount') AS INTEGER) usage_cache_read_tokens
      , CAST(json_extract_scalar(output.outputbodyjson, '$.usage.cacheWriteInputTokenCount') AS INTEGER) usage_cache_write_tokens
      , json_extract_scalar(output.outputbodyjson, '$.stopReason') stop_reason
      , COALESCE(json_extract_scalar(output.outputbodyjson, '$.output.message.content[0].text'), json_extract_scalar(output.outputbodyjson, '$.content[0].text'), json_extract_scalar(output.outputbodyjson, '$.completion'), json_extract_scalar(output.outputbodyjson, '$.outputText')) response_preview
      , COALESCE(json_extract_scalar(input.inputbodyjson, '$.messages[0].content[0].text'), json_extract_scalar(input.inputbodyjson, '$.messages[0].content'), json_extract_scalar(input.inputbodyjson, '$.prompt'), json_extract_scalar(input.inputbodyjson, '$.inputText')) prompt_preview
      FROM
        "${athena_database_name}".bedrock_logs
