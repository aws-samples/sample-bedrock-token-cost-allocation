                SourceTableId: 3908a1f9-85bf-4c60-b078-9ada9d2144fe
        DestinationTableMap:
          23485f7f-1560-4275-92ea-7cb15b30d9ba:
            Alias: Destination Table 1
            Source:
              TransformOperationId: d89d9381-f10c-43c3-a343-d3d0b0d837e8
      SemanticModelConfiguration:
        TableMap:
          840618aa-cbdb-4df1-b6b2-a58212e621c4:
            Alias: Semantic Table 1
            DestinationTableId: 23485f7f-1560-4275-92ea-7cb15b30d9ba
