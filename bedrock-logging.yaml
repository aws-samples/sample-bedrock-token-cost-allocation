AWSTemplateFormatVersion: '2010-09-09'
Description: 'Bedrock Observability - CloudWatch Logs, IAM role, Application Inference Profile, and CWL subscription to central Firehose destination'

Parameters:
  CentralCWLDestinationArn:
    Type: String
    Description: 'ARN of the CloudWatch Logs Destination in the central account (output CWLDestinationArn from bedrock-firehose-data-lake stack)'
    AllowedPattern: 'arn:aws:logs:.*'

Resources:

  # ---------------------------------------------------------------------------
  # KMS Key for CloudWatch Log Group encryption
  # ---------------------------------------------------------------------------
  BedrockLogsKmsKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: 'KMS key for encrypting Bedrock CloudWatch log group'
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowAccountRoot
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: AllowCloudWatchLogs
            Effect: Allow
            Principal:
              Service: !Sub 'logs.${AWS::Region}.amazonaws.com'
            Action:
              - kms:Encrypt*
              - kms:Decrypt*
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:Describe*
            Resource: '*'
            Condition:
              ArnLike:
                'kms:EncryptionContext:aws:logs:arn': !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock/modelinvocations'
      Tags:
        - Key: FinOps
          Value: bedrock-logging

  BedrockLogsKmsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/bedrock-logs-key
      TargetKeyId: !Ref BedrockLogsKmsKey

  # CloudWatch Log Group for Bedrock model invocation logs
  BedrockLogsGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /aws/bedrock/modelinvocations
      RetentionInDays: 7
      KmsKeyId: !GetAtt BedrockLogsKmsKey.Arn
      Tags:
        - Key: FinOps
          Value: bedrock-logging

  # ---------------------------------------------------------------------------
  # IAM Managed Policy for Bedrock Logging (CloudWatch only)
  # ---------------------------------------------------------------------------
  BedrockLoggingPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'bedrock-logging-policy-${AWS::Region}'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock/modelinvocations:*'

  # IAM Role that Bedrock assumes to write logs to CloudWatch
  BedrockLoggingRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: bedrock-logging-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      ManagedPolicyArns:
        - !Ref BedrockLoggingPolicy
      Tags:
        - Key: FinOps
          Value: bedrock-logging

  # IAM role that CloudWatch Logs assumes to validate organization-scoped
  # cross-account subscription filters. This role is required when the central
  # destination policy uses aws:PrincipalOrgID.
  CWLSubscriptionFilterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: bedrock-cwl-subscription-filter-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: logs.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ValidateBedrockLogGroupSubscription
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock/modelinvocations:*'
      Tags:
        - Key: FinOps
          Value: bedrock-logging

  # ---------------------------------------------------------------------------
  # CloudWatch Logs subscription filter pointing at the central CWL Destination
  # The destination in the central account handles delivery to Firehose. The
  # sender-account role is required for an organization-scoped destination policy.
  # ---------------------------------------------------------------------------
  BedrockCWLSubscriptionFilter:
    Type: AWS::Logs::SubscriptionFilter
    Properties:
      LogGroupName: !Ref BedrockLogsGroup
      DestinationArn: !Ref CentralCWLDestinationArn
      RoleArn: !GetAtt CWLSubscriptionFilterRole.Arn
      FilterPattern: ''
      FilterName: bedrock-firehose-subscription

Outputs:
  BedrockLogsGroupName:
    Description: CloudWatch Log Group name for Bedrock model invocations
    Value: !Ref BedrockLogsGroup
    Export:
      Name: !Sub '${AWS::StackName}-LogGroupName'

  BedrockLoggingRoleArn:
    Description: ARN of the IAM role for Bedrock logging
    Value: !GetAtt BedrockLoggingRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-LoggingRoleArn'
